sources:
  - name: jaffle_shop
    database: gwu_analytics_dev
    schema: rsaplan
    config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        config:
          freshness: null 
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null